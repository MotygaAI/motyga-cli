name: Release (motyga CLI)

# Builds the per-platform npm payloads for the Motyga CLI natively on the
# matching GitHub-hosted runner (no cross-compilation), then optionally
# publishes them plus the thin meta package `@motyga/cli@<ver>`.
#
# Each platform payload is published to the SAME npm name with a version tag,
# e.g. `@motyga/cli@<ver>-win32-x64`; the meta package pulls the right one via
# an optionalDependency and `bin/motyga.js` execs the vendored `motyga` binary.
#
# NOTE: Windows (x64/arm64) and macOS (x64/arm64) are green in CI. Linux builds gnu (glibc) natively on
# the matching-arch runner and links libcap for the bwrap sandbox (libcap-dev installed below).
# `fail-fast: false` keeps the legs independent.
#
# Publishing is gated on the `publish` input (or a `v*` tag) AND an `NPM_TOKEN`
# repo secret. Building + smoke-testing always runs.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version to stage (e.g. 0.1.0). Defaults to npm/package.json."
        required: false
        default: ""
      publish:
        description: "Publish to npm (needs NPM_TOKEN secret + owned @motyga scope)."
        type: boolean
        required: false
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$v" ]; then
            v="$(node -p "require('./npm/package.json').version")"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Release version: $v"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # All six platforms. The initial publish was Windows-only to skip the slow macOS/arm runner
          # queue; supply mode changes the calculus, because an always-on node is exactly the thing people
          # run on a Linux box, and a supplier who cannot install the CLI cannot sell anything. The Linux
          # and macOS legs built green in run 28775778997. The meta package lists every platform as an
          # OPTIONAL dependency, so a leg that fails is a clean skip for that platform, not a broken release.
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,    pkg: motyga-linux-x64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, pkg: motyga-linux-arm64 }
          # macOS Intel (x86_64-apple-darwin) needs a macos-13 runner, and that pool no longer picks jobs
          # up: in run 30648975444 it sat QUEUED for two hours with no runner ever assigned, while every
          # other leg — including Apple Silicon — built and finished. GitHub is retiring macos-13, so this
          # leg blocks the publish indefinitely rather than merely being slow. Left out until there is a
          # runner that serves it; Apple Silicon covers the overwhelming majority of Macs, and the meta
          # package treats each platform as optional, so an absent one is "not available there", not a break.
          # - { target: x86_64-apple-darwin,     os: macos-13,         pkg: motyga-darwin-x64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,     pkg: motyga-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest,   pkg: motyga-win32-x64 }
          - { target: aarch64-pc-windows-msvc,   os: windows-11-arm,   pkg: motyga-win32-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Run from motyga-rs so rustup reads its pinned rust-toolchain.toml (channel 1.95.0) and adds the
      # cross target to THAT toolchain — the one `cargo build` (cwd=motyga-rs) actually uses. Adding it at
      # the repo root targeted the default toolchain instead, so the pinned build hit "target not installed".
      - name: Rust toolchain
        shell: bash
        working-directory: motyga-rs
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            motyga-rs/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('motyga-rs/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Linux payloads are gnu (glibc) built natively on the matching-arch runner — no cross-compilation,
      # and consistent with the glibc Node.js that runs bin/motyga.js. The bwrap sandbox compiles vendored
      # bubblewrap and links libcap, so libcap-dev + pkg-config must be present.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcap-dev pkg-config

      # The workspace version is a 0.0.0 dev-sentinel; stamp the real release
      # version into Cargo.toml BEFORE the cargo build so the compiled binary's
      # `--version` matches the published npm package (env!("CARGO_PKG_VERSION")).
      # Python (already set up above) keeps this portable across win/mac/linux runners.
      - name: Stamp release version into workspace
        shell: bash
        run: |
          python - "${{ needs.prepare.outputs.version }}" <<'PY'
          import pathlib, sys
          version = sys.argv[1]
          path = pathlib.Path("motyga-rs/Cargo.toml")
          text = path.read_text()
          stamped = text.replace('version = "0.0.0"', f'version = "{version}"', 1)
          if stamped == text:
              sys.exit("dev-sentinel `version = \"0.0.0\"` not found in motyga-rs/Cargo.toml")
          path.write_text(stamped)
          print(f"stamped workspace version -> {version}")
          PY

      # Builds the RELEASE entrypoint + platform helpers via cargo and
      # self-fetches ripgrep from the checked-in DotSlash manifest, then
      # assembles + validates the vendor payload.
      - name: Build package payload
        shell: bash
        run: |
          python scripts/build_motyga_package.py \
            --target ${{ matrix.target }} \
            --cargo-profile release \
            --package-dir dist/pkgroot/${{ matrix.target }} \
            --force

      # macOS refuses to run unsigned Mach-O from some contexts; ad-hoc signing
      # is enough for local execution. Developer-ID notarization is a separate
      # (owner) concern requiring an Apple account.
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          find "dist/pkgroot/${{ matrix.target }}" -type f -perm +111 -print0 \
            | xargs -0 -I {} codesign --force --sign - "{}" || true

      - name: Stage + pack npm platform package
        shell: bash
        run: |
          python npm/scripts/build_npm_package.py \
            --package ${{ matrix.pkg }} \
            --release-version "${{ needs.prepare.outputs.version }}" \
            --vendor-src dist/pkgroot \
            --pack-output "dist/${{ matrix.pkg }}.tgz"

      # Each leg runs natively on a matching-arch runner, so the vendored binary
      # is executable here. Drop the payload next to bin/motyga.js (its fallback
      # path) and confirm it runs.
      - name: Smoke test (motyga --version)
        shell: bash
        run: |
          mkdir -p dist/smoke/bin dist/smoke/vendor
          cp npm/bin/motyga.js dist/smoke/bin/motyga.js
          cp -r "dist/pkgroot/${{ matrix.target }}" "dist/smoke/vendor/${{ matrix.target }}"
          out="$(node dist/smoke/bin/motyga.js --version)"
          echo "motyga --version => $out"
          case "$out" in
            motyga\ *) echo "OK" ;;
            *) echo "Unexpected version output"; exit 1 ;;
          esac

      - name: Upload payload
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.pkg }}
          path: dist/${{ matrix.pkg }}.tgz
          if-no-files-found: error

      # The standalone installers (scripts/install/install.{sh,ps1}) and the Python
      # SDK bootstrap do not go through npm: they pull `motyga-package-<triple>.tar.gz`
      # off a GitHub release. Archive the payload we just built and validated so the
      # `github-release` job below can attach it. Signing already happened above, so
      # this packs the signed tree.
      # Archive the tree that was just built, signed and smoke-tested — do NOT
      # re-run build_motyga_package.py here, because that rebuilds the payload and
      # would replace the ad-hoc-signed macOS binaries with unsigned ones.
      - name: Archive standalone package
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from motyga_package.archive import write_archive

          target = "${{ matrix.target }}"
          write_archive(
              Path("dist/pkgroot") / target,
              Path(f"dist/motyga-package-{target}.tar.gz"),
              force=True,
          )
          print(f"archived dist/motyga-package-{target}.tar.gz")
          PY

      - name: Upload standalone package
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.pkg }}
          path: dist/motyga-package-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  meta:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Stage + pack npm meta package
        shell: bash
        run: |
          python npm/scripts/build_npm_package.py \
            --package motyga \
            --release-version "${{ needs.prepare.outputs.version }}" \
            --pack-output dist/motyga-cli.tgz
      - name: Upload meta
        uses: actions/upload-artifact@v7
        with:
          name: npm-meta
          path: dist/motyga-cli.tgz
          if-no-files-found: error

  publish:
    needs: [prepare, build, meta]
    if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Download all payloads
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Platform payloads must exist on npm before the meta package (whose
      # optionalDependency points at them) is installed, so publish meta last.
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          # Prefix with ./ so npm treats the argument as a local tarball path.
          # A bare "dist/foo.tgz" (slash, no ./) is parsed as a GitHub shorthand
          # spec and npm tries `git ls-remote` over SSH, failing with exit 128.
          # Match the platform payloads by their OS segment, NOT `motyga-*.tgz`:
          # the meta package is `dist/motyga-cli.tgz`, so a broad glob would sort
          # it first (breaking "platforms before meta") and then publish it twice,
          # the second time onto an already-published version, which npm rejects.
          for tgz in dist/motyga-linux-*.tgz dist/motyga-darwin-*.tgz dist/motyga-win32-*.tgz; do
            echo "publish $tgz"
            npm publish "./$tgz" --access public
          done
          echo "publish dist/motyga-cli.tgz (meta)"
          npm publish ./dist/motyga-cli.tgz --access public

  # npm is not the only distribution channel: `scripts/install/install.sh`,
  # `install.ps1` and the Python SDK bootstrap all download binaries from a GitHub
  # release instead. They resolve the tag `rust-v<version>` and then look for
  # `motyga-package-<triple>.tar.gz` plus `motyga-package_SHA256SUMS`. Nothing used
  # to create that release, so those installers had nothing to fetch.
  github-release:
    needs: [prepare, build]
    if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download standalone packages
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-*
          path: dist
          merge-multiple: true

      # The installers verify the download against this file before unpacking, so a
      # release carrying archives without it is treated as unusable and skipped.
      - name: Write checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum motyga-package-*.tar.gz > motyga-package_SHA256SUMS
          cat motyga-package_SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="rust-v${VERSION}"
          # A leg that failed is a clean skip for that platform (the meta package
          # treats each as optional), so re-running the workflow must be able to add
          # the missing archive to an existing release rather than fail on it.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — uploading assets with --clobber"
            gh release upload "$tag" \
              dist/motyga-package-*.tar.gz dist/motyga-package_SHA256SUMS --clobber
          else
            gh release create "$tag" \
              --title "motyga $VERSION" \
              --notes "Standalone packages for \`motyga\` $VERSION. Installed via scripts/install/install.sh or install.ps1; \`npm i -g @motyga/cli\` uses npm instead." \
              dist/motyga-package-*.tar.gz dist/motyga-package_SHA256SUMS
          fi

  # Guards the upload-artifact -> download-artifact round-trip (incl. merge-multiple)
  # on every build — the real download otherwise runs only in the publish job.
  verify-artifacts:
    needs: [build, meta]
    runs-on: ubuntu-latest
    steps:
      - name: Download all payloads (download-artifact@v8, merge-multiple)
        uses: actions/download-artifact@v8
        with:
          path: dl
          merge-multiple: true
      - name: Assert payloads arrived
        shell: bash
        run: |
          ls -R dl
          for f in motyga-win32-x64.tgz motyga-win32-arm64.tgz motyga-cli.tgz \
                   motyga-package-x86_64-pc-windows-msvc.tar.gz \
                   motyga-package-aarch64-pc-windows-msvc.tar.gz; do
            test -f "dl/$f" || { echo "MISSING dl/$f"; exit 1; }
          done
          echo "artifact round-trip upload@v7 -> download@v8 + merge-multiple OK"

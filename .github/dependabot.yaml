# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-

version: 2
updates:
  # The `bun` entry that used to sit here pointed at `.github/actions/codex`,
  # a directory this repo has never had, so the job failed on every run.
  - package-ecosystem: cargo
    directories:
      - motyga-rs
      - motyga-rs/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Was `codex-cli`, which holds no Dockerfile — the job failed every run. The
  # repo's Dockerfiles live in .devcontainer.
  - package-ecosystem: docker
    directory: .devcontainer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: rust-toolchain
    directory: motyga-rs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

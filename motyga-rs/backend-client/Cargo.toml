[package]
name = "motyga-backend-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
motyga-backend-openapi-models = { path = "../motyga-backend-openapi-models" }
motyga-api = { workspace = true }
motyga-client = { workspace = true }
motyga-login = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-protocol = { workspace = true }

[dev-dependencies]
pretty_assertions = "1"

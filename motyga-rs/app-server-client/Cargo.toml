[package]
name = "motyga-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "motyga_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
motyga-app-server = { workspace = true }
motyga-app-server-protocol = { workspace = true }
motyga-arg0 = { workspace = true }
motyga-config = { workspace = true }
motyga-core = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-feedback = { workspace = true }
motyga-protocol = { workspace = true }
motyga-uds = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

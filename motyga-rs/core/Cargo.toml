[package]
edition.workspace = true
license.workspace = true
name = "motyga-core"
version.workspace = true

[lib]
name = "motyga_core"
path = "src/lib.rs"

[[bin]]
name = "motyga-write-config-schema"
path = "src/bin/config_schema.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
async-channel = { workspace = true }
base64 = { workspace = true }
bm25 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
motyga-analytics = { workspace = true }
motyga-agent-graph-store = { workspace = true }
motyga-api = { workspace = true }
motyga-app-server-protocol = { workspace = true }
motyga-apply-patch = { workspace = true }
motyga-async-utils = { workspace = true }
motyga-code-mode = { workspace = true }
motyga-connectors = { workspace = true }
motyga-context-fragments = { workspace = true }
motyga-config = { workspace = true }
motyga-core-plugins = { workspace = true }
motyga-core-skills = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-extension-api = { workspace = true }
motyga-features = { workspace = true }
motyga-feedback = { workspace = true }
motyga-file-system = { workspace = true }
motyga-login = { workspace = true }
motyga-memories-read = { workspace = true }
motyga-mcp = { workspace = true }
motyga-model-provider-info = { workspace = true }
motyga-models-manager = { workspace = true }
motyga-shell-command = { workspace = true }
motyga-execpolicy = { workspace = true }
motyga-git-utils = { workspace = true }
motyga-hooks = { workspace = true }
motyga-install-context = { workspace = true }
motyga-network-proxy = { workspace = true }
motyga-otel = { workspace = true }
motyga-plugin = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-protocol = { workspace = true }
motyga-response-debug-context = { workspace = true }
motyga-prompts = { workspace = true }
motyga-rollout = { workspace = true }
motyga-rollout-trace = { workspace = true }
motyga-rmcp-client = { workspace = true }
motyga-sandboxing = { workspace = true }
motyga-state = { workspace = true }
motyga-terminal-detection = { workspace = true }
motyga-thread-store = { workspace = true }
motyga-tools = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-cache = { workspace = true }
motyga-utils-image = { workspace = true }
motyga-utils-home-dir = { workspace = true }
motyga-utils-output-truncation = { workspace = true }
motyga-utils-path = { workspace = true }
motyga-utils-path-uri = { workspace = true }
motyga-utils-plugins = { workspace = true }
motyga-utils-pty = { workspace = true }
motyga-utils-string = { workspace = true }
motyga-utils-stream-parser = { workspace = true }
motyga-windows-sandbox = { package = "motyga-windows-sandbox", path = "../windows-sandbox-rs" }
csv = { workspace = true }
dirs = { workspace = true }
dunce = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
iana-time-zone = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
indexmap = { workspace = true }
libc = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
regex-lite = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
rmcp = { workspace = true, default-features = false, features = [
    "base64",
    "macros",
    "schemars",
    "server",
] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
shlex = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true, features = ["rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v4", "v5"] }
which = { workspace = true }
whoami = { workspace = true }

# Build OpenSSL from source for musl builds.
[target.x86_64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

# Build OpenSSL from source for musl builds.
[target.aarch64-unknown-linux-musl.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }

[target.'cfg(unix)'.dependencies]
motyga-shell-escalation = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
motyga-image-generation-extension = { workspace = true }
motyga-home = { workspace = true }
motyga-otel = { workspace = true }
motyga-test-binary-support = { workspace = true }
motyga-utils-cargo-bin = { workspace = true }
motyga-web-search-extension = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
insta = { workspace = true }
maplit = { workspace = true }
opentelemetry = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
test-case = "3.3.1"
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "metrics",
] }
serial_test = { workspace = true }
tempfile = { workspace = true }
test-log = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-test = { workspace = true, features = ["no-env-filter"] }
walkdir = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["openssl-sys"]
ignored-paths = ["tests/remote_env_windows/*.rs"]

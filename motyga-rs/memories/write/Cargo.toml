[package]
edition.workspace = true
license.workspace = true
name = "motyga-memories-write"
version.workspace = true

[lib]
name = "motyga_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
motyga-backend-client = { workspace = true }
motyga-core = { workspace = true }
motyga-config = { workspace = true }
motyga-features = { workspace = true }
motyga-git-utils = { workspace = true }
motyga-login = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-otel = { workspace = true }
motyga-protocol = { workspace = true }
motyga-rollout = { workspace = true }
motyga-rollout-trace = { workspace = true }
motyga-secrets = { workspace = true }
motyga-state = { workspace = true }
motyga-terminal-detection = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-output-truncation = { workspace = true }
motyga-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
motyga-model-provider-info = { workspace = true }
motyga-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }

[package]
edition.workspace = true
license.workspace = true
name = "motyga-goal-extension"
version.workspace = true

[lib]
name = "motyga_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
motyga-analytics = { workspace = true }
motyga-core = { workspace = true }
motyga-extension-api = { workspace = true }
motyga-otel = { workspace = true }
motyga-protocol = { workspace = true }
motyga-state = { workspace = true }
motyga-tools = { workspace = true }
motyga-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package]
edition.workspace = true
license.workspace = true
name = "motyga-image-generation-extension"
version.workspace = true

[lib]
name = "motyga_image_generation_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
motyga-api = { workspace = true }
motyga-core = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-extension-api = { workspace = true }
motyga-login = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-model-provider-info = { workspace = true }
motyga-protocol = { workspace = true }
motyga-tools = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-image = { workspace = true }
motyga-utils-path-uri = { workspace = true }
http = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

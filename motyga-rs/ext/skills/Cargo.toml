[package]
edition.workspace = true
license.workspace = true
name = "motyga-skills-extension"
version.workspace = true

[lib]
name = "motyga_skills_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
motyga-core-skills = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-extension-api = { workspace = true }
motyga-mcp = { workspace = true }
motyga-protocol = { workspace = true }
motyga-tools = { workspace = true }
motyga-utils-path-uri = { workspace = true }
motyga-utils-string = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
motyga-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package]
name = "motyga-supply"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Deliberately light. `motyga supply run` is an always-on background daemon on somebody's home machine, so
# it must not drag in the whole agent runtime — it needs an HTTP client, a WebSocket, and JSON. Nothing here
# can execute a command, patch a file, or open a sandbox, and that is a property worth keeping obvious from
# the dependency list.
[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true, features = ["derive"] }
dirs = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal", "process"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lib]
doctest = false

[package]
edition.workspace = true
license.workspace = true
name = "motyga-model-provider"
version.workspace = true

[lib]
doctest = false
name = "motyga_model_provider"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
motyga-api = { workspace = true }
motyga-agent-identity = { workspace = true }
motyga-aws-auth = { workspace = true }
motyga-client = { workspace = true }
motyga-feedback = { workspace = true }
motyga-login = { workspace = true }
motyga-model-provider-info = { workspace = true }
motyga-models-manager = { workspace = true }
motyga-otel = { workspace = true }
motyga-protocol = { workspace = true }
motyga-response-debug-context = { workspace = true }
http = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
wiremock = { workspace = true }

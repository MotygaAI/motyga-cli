[package]
name = "motyga-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "motyga-app-server"
path = "src/main.rs"

[[bin]]
name = "motyga-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[lib]
name = "motyga_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
motyga-analytics = { workspace = true }
motyga-arg0 = { workspace = true }
motyga-cloud-config = { workspace = true }
motyga-config = { workspace = true }
motyga-connectors = { workspace = true }
motyga-core = { workspace = true }
motyga-core-plugins = { workspace = true }
motyga-home = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-extension-api = { workspace = true }
motyga-external-agent-migration = { workspace = true }
motyga-external-agent-sessions = { workspace = true }
motyga-features = { workspace = true }
motyga-goal-extension = { workspace = true }
motyga-guardian = { workspace = true }
motyga-git-utils = { workspace = true }
motyga-file-watcher = { workspace = true }
motyga-hooks = { workspace = true }
motyga-otel = { workspace = true }
motyga-plugin = { workspace = true }
motyga-shell-command = { workspace = true }
motyga-skills-extension = { workspace = true }
motyga-utils-cli = { workspace = true }
motyga-utils-pty = { workspace = true }
motyga-backend-client = { workspace = true }
motyga-file-search = { workspace = true }
motyga-chatgpt = { workspace = true }
motyga-login = { workspace = true }
motyga-image-generation-extension = { workspace = true }
motyga-memories-extension = { workspace = true }
motyga-web-search-extension = { workspace = true }
motyga-memories-write = { workspace = true }
motyga-mcp = { workspace = true }
motyga-mcp-extension = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-models-manager = { workspace = true }
motyga-protocol = { workspace = true }
motyga-app-server-protocol = { workspace = true }
motyga-app-server-transport = { workspace = true }
motyga-feedback = { workspace = true }
motyga-rmcp-client = { workspace = true }
motyga-rollout = { workspace = true }
motyga-sandboxing = { workspace = true }
motyga-state = { workspace = true }
motyga-thread-store = { workspace = true }
motyga-tools = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-json-to-toml = { workspace = true }
motyga-utils-path-uri = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "json"] }

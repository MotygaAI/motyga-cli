[package]
name = "motyga-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "motyga"
path = "src/main.rs"

[lib]
name = "motyga_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
motyga-app-server = { workspace = true }
motyga-app-server-daemon = { workspace = true }
motyga-app-server-protocol = { workspace = true }
motyga-app-server-test-client = { workspace = true }
motyga-arg0 = { workspace = true }
motyga-api = { workspace = true }
motyga-chatgpt = { workspace = true }
motyga-cloud-tasks = { path = "../cloud-tasks" }
motyga-utils-cli = { workspace = true }
motyga-config = { workspace = true }
motyga-core = { workspace = true }
motyga-core-plugins = { workspace = true }
motyga-home = { workspace = true }
motyga-exec = { workspace = true }
motyga-exec-server = { workspace = true }
motyga-execpolicy = { workspace = true }
motyga-features = { workspace = true }
motyga-git-utils = { workspace = true }
motyga-install-context = { workspace = true }
motyga-login = { workspace = true }
motyga-memories-write = { workspace = true }
motyga-mcp = { workspace = true }
motyga-supply = { workspace = true }
motyga-mcp-server = { workspace = true }
motyga-model-provider = { workspace = true }
motyga-models-manager = { workspace = true }
motyga-plugin = { workspace = true }
motyga-protocol = { workspace = true }
motyga-responses-api-proxy = { workspace = true }
motyga-rmcp-client = { workspace = true }
motyga-rollout = { workspace = true }
motyga-rollout-trace = { workspace = true }
motyga-sandboxing = { workspace = true }
motyga-state = { workspace = true }
motyga-stdio-to-uds = { workspace = true }
motyga-terminal-detection = { workspace = true }
motyga-tui = { workspace = true }
motyga-utils-absolute-path = { workspace = true }
motyga-utils-path = { workspace = true }
crossterm = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
motyga_windows_sandbox = { package = "motyga-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
motyga-utils-cargo-bin = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sqlx = { workspace = true }
wiremock = { workspace = true }
